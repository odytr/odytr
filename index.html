<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>odytr | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
    }

    header {
      text-align: center;
      padding: 60px 20px;
    }

    h1 {
      font-size: 2.5rem;
      color: #58a6ff;
    }

    h2 {
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 5px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #161b22;
      padding: 20px;
      margin: 15px 0;
      border-radius: 10px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 15px rgba(88,166,255,0.2);
    }

    a {
      color: #58a6ff;
      text-decoration: none;
    }

    .badge {
      display: inline-block;
      background: #21262d;
      padding: 5px 10px;
      border-radius: 5px;
      margin: 5px 5px 0 0;
      font-size: 0.8rem;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #8b949e;
      font-size: 0.9rem;
    }

    .status {
      color: #f1c40f;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>odytr</h1>
  <p>Security Analyst</p>
  <p class="status">Portfolio In Progress...</p>
</header>

<div class="container">

  

</div>

<footer>
 
</footer>

</body>
</html>
